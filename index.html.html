<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Rotas de Entrega</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- PapaParse para ler CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- jsPDF e jsPDF-AutoTable para gerar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <!-- SheetJS para gerar Excel/Planilha -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- JSZip e FileSaver para exportar tudo em ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .drag-active { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        // Componente de Ícones SVG para evitar conflitos com o React DOM (NotFoundError)
        const Icon = ({ name, className }) => {
            const icons = {
                'map': <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>,
                'file-spreadsheet': <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M8 13h2"></path><path d="M8 17h2"></path><path d="M14 13h2"></path><path d="M14 17h2"></path></svg>,
                'alert-circle': <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>,
                'truck': <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>,
                'file-down': <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M12 18v-6"></path><polyline points="9 15 12 18 15 15"></polyline></svg>,
                'table': <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="10" y1="9" x2="10" y2="21"></line><line x1="14" y1="9" x2="14" y2="21"></line></svg>,
                'download': <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
                'loader-2': <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>,
                'archive': <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>
            };
            return icons[name] || null;
        };

        function App() {
            const [file, setFile] = useState(null);
            const [csvData, setCsvData] = useState([]);
            const [routes, setRoutes] = useState({});
            const [isDragging, setIsDragging] = useState(false);
            const [processing, setProcessing] = useState(false);
            const [error, setError] = useState('');
            const fileInputRef = useRef(null);

            // Nomes de colunas possíveis para mapeamento inteligente (incluindo o novo formato)
            const possibleRouteCols = ['rota', 'route', 'roteiro', 'codigo da rota'];
            const possibleSeqCols = ['n.', 'nº', 'sequencia', 'seq', 'ordem'];
            const possibleIdCols = ['id do pacote', 'pacote', 'id', 'tracking', 'rastreio', 'shipment'];
            const possibleClientCols = ['cliente', 'nome', 'destinatario'];
            const possibleAddrCols = ['endereço', 'endereco', 'rua', 'logradouro'];
            const possibleNumCols = ['número', 'numero', 'nº endereço', 'nº num'];
            const possibleCompCols = ['complemento', 'comp'];
            const possibleNbhdCols = ['bairro'];
            const possibleCityCols = ['cidade', 'municipio'];
            const possibleZipCols = ['cep'];
            const possibleTypeCols = ['tipo', 'tipo de endereço', 'tipo_de_endereco', 'tipo de endereco'];

            const findColumn = (headers, possibleNames) => {
                // Remove espaços em branco e underscores para facilitar a correspondência
                const normalizedHeaders = headers.map(h => h.toLowerCase().replace(/_/g, ' '));
                const index = normalizedHeaders.findIndex(h => possibleNames.some(p => h.includes(p)));
                return index !== -1 ? headers[index] : null;
            };

            const handleFileUpload = (uploadedFile) => {
                if (!uploadedFile) return;
                
                if (uploadedFile.type !== 'text/csv' && !uploadedFile.name.endsWith('.csv') && !uploadedFile.type.includes('excel')) {
                    setError('Por favor, envie apenas ficheiros CSV.');
                    return;
                }

                setFile(uploadedFile);
                setError('');
                setProcessing(true);

                Papa.parse(uploadedFile, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        const data = results.data;
                        if (data.length === 0) {
                            setError('O ficheiro CSV está vazio.');
                            setProcessing(false);
                            return;
                        }

                        const headers = Object.keys(data[0]);
                        const routeCol = findColumn(headers, possibleRouteCols);

                        if (!routeCol) {
                            setError('Não foi possível identificar a coluna de "Rota" no CSV. Certifique-se de ter uma coluna com nome "Rota", "Roteiro" etc.');
                            setProcessing(false);
                            return;
                        }

                        // Agrupar por rota
                        const groupedRoutes = {};
                        data.forEach(row => {
                            let routeName = row[routeCol]?.trim() || 'Sem_Rota';

                            if (!groupedRoutes[routeName]) {
                                groupedRoutes[routeName] = [];
                            }
                            groupedRoutes[routeName].push(row);
                        });

                        setCsvData(data);
                        setRoutes(groupedRoutes);
                        setProcessing(false);
                    },
                    error: function(err) {
                        setError('Erro ao ler o CSV: ' + err.message);
                        setProcessing(false);
                    }
                });
            };

            const generatePDF = (routeName, routeData, returnBlob = false) => {
                const { jsPDF } = window.jspdf;
                // Formato paisagem (landscape) para acomodar todas as colunas pedidas
                const doc = new jsPDF('l', 'mm', 'a4');
                
                // Configurações da página
                const pageWidth = doc.internal.pageSize.width;
                
                // Verificar se a rota tem pacotes bulky
                const hasBulky = routeData.some(row => (row['tipo_pacote'] || '').toLowerCase().includes('bulky'));
                
                // Cabeçalho superior (semelhante ao modelo Mercado Envios)
                doc.setFontSize(16);
                doc.setFont("helvetica", "bold");
                doc.text("mercado", 14, 18);
                doc.text("envios", 14, 24);
                
                doc.setFontSize(10);
                doc.setFont("helvetica", "normal");
                
                // Dados do Motorista
                doc.text(`Motorista: _____________________________________`, 60, 18);
                doc.text(`Placa: __________________`, 60, 26);
                
                // Badge BULKY se houver
                if (hasBulky) {
                    doc.setFillColor(0, 0, 0); // Fundo preto
                    doc.rect(190, 11, 35, 10, 'F');
                    doc.setTextColor(255, 255, 255); // Texto branco
                    doc.setFontSize(14);
                    doc.setFont("helvetica", "bold");
                    doc.text("BULKY", 207.5, 18, { align: "center" });
                    doc.setTextColor(0, 0, 0); // Restaurar cor preta para o resto
                }
                
                doc.setFontSize(11);
                doc.setFont("helvetica", "bold");
                // Ajustado para o lado para dar espaço à tag
                doc.text(`Rota: ${routeName}`, 235, 18);
                doc.text(`Total: ${routeData.length} pacotes`, 235, 26);

                // Preparar dados para a tabela usando exatamente as colunas solicitadas
                const tableColumns = [
                    "Ordem", "Shipment", "Estado", "Cidade", "Bairro", 
                    "CEP", "Tipo de veiculo", "SPR", "T. End.", "T. Cli.", "Ação", "Pacote"
                ];
                
                const tableRows = routeData.map((row, index) => {
                    // Tratar a sequência para ter o formato '1A', '2A'
                    let seqRaw = row['Ordem'] || (index + 1).toString();
                    let seq = /^\d+$/.test(seqRaw) ? `${seqRaw}A` : seqRaw;
                    
                    // Tipo (Residencial -> R, Comercial -> C)
                    let tipoRaw = row['tipo_de_endereco'] || '';
                    let tipo = tipoRaw ? tipoRaw.charAt(0).toUpperCase() : '-';
                    
                    // Substituir general_merchant por Normal
                    let tipoPacoteRaw = row['tipo_pacote'] || '-';
                    let tipoPacote = tipoPacoteRaw === 'general_merchant' ? 'Normal' : tipoPacoteRaw;
                    if (tipoPacote.toLowerCase() === 'bulky') {
                        tipoPacote = 'Bulky'; // Capitalizado para ficar bonito na tabela
                    }
                    
                    return [
                        seq, 
                        row['Shipment'] || '-', 
                        row['Estado'] || '-', 
                        row['Cidade'] || '-', 
                        row['Bairro'] || '-', 
                        row['CEP'] || '-', 
                        row['Veiculo'] || '-', 
                        row['SPR'] || '-', 
                        tipo, 
                        row['tipo_cliente'] || '-', 
                        row['tipo_de_acao'] || '-', 
                        tipoPacote
                    ];
                });

                // Gerar Tabela estilo Logística
                doc.autoTable({
                    head: [tableColumns],
                    body: tableRows,
                    startY: 32,
                    theme: 'grid',
                    styles: {
                        fontSize: 7,
                        cellPadding: 2,
                        valign: 'middle',
                        lineColor: [150, 150, 150],
                        lineWidth: 0.1,
                        overflow: 'linebreak'
                    },
                    headStyles: {
                        fillColor: [240, 240, 240],
                        textColor: [0, 0, 0],
                        fontStyle: 'bold',
                        halign: 'center'
                    },
                    columnStyles: {
                        0: { cellWidth: 12, halign: 'center', fontStyle: 'bold' }, // Ordem
                        1: { cellWidth: 23 }, // Shipment
                        2: { cellWidth: 15 }, // Estado
                        3: { cellWidth: 25 }, // Cidade
                        4: { cellWidth: 30 }, // Bairro
                        5: { cellWidth: 16 }, // CEP
                        6: { cellWidth: 30 }, // Veiculo
                        7: { cellWidth: 10, halign: 'center' }, // SPR
                        8: { cellWidth: 12, halign: 'center' }, // T. End.
                        9: { cellWidth: 18 }, // T. Cli.
                        10: { cellWidth: 18 }, // Ação
                        11: { cellWidth: 'auto' } // Pacote
                    },
                    didDrawPage: function (data) {
                        // Rodapé detalhado
                        const pageCount = doc.internal.getNumberOfPages();
                        doc.setFontSize(8);
                        doc.setFont("helvetica", "normal");
                        
                        const strRodape = `Roteiro SERVICE CENTER | Transportadora: ______________________ | Rota ${routeName} | Data: ___/___/20___`;
                        doc.text(strRodape, 14, doc.internal.pageSize.height - 10);
                        doc.text(`Folha ${data.pageNumber}`, pageWidth - 25, doc.internal.pageSize.height - 10);
                    }
                });

                if (returnBlob) {
                    return doc.output('blob');
                } else {
                    doc.save(`Rota_${routeName}.pdf`);
                }
            };

            const downloadAllAsZip = async () => {
                setProcessing(true);
                try {
                    const zip = new JSZip();
                    
                    Object.entries(routes).forEach(([routeName, routeData]) => {
                        // Gera o PDF como Blob em vez de fazer download direto
                        const pdfBlob = generatePDF(routeName, routeData, true);
                        zip.file(`Rota_${routeName}.pdf`, pdfBlob);
                    });
                    
                    // Gera e faz download do arquivo ZIP final
                    const zipContent = await zip.generateAsync({ type: "blob" });
                    window.saveAs(zipContent, "Rotas_PDFs.zip");
                } catch (err) {
                    setError("Erro ao gerar o ficheiro ZIP: " + err.message);
                } finally {
                    setProcessing(false);
                }
            };

            // Nova função para exportar os dados para Planilha/Excel
            const exportToExcel = () => {
                let allData = [];
                
                Object.entries(routes).forEach(([routeName, routeData]) => {
                    routeData.forEach((row, index) => {
                        let seqRaw = row['Ordem'] || (index + 1).toString();
                        let seq = /^\d+$/.test(seqRaw) ? `${seqRaw}A` : seqRaw;
                        
                        let tipoRaw = row['tipo_de_endereco'] || '';
                        let tipo = tipoRaw ? tipoRaw.charAt(0).toUpperCase() : '-';
                        
                        let tipoPacoteRaw = row['tipo_pacote'] || '-';
                        let tipoPacote = tipoPacoteRaw === 'general_merchant' ? 'Normal' : tipoPacoteRaw;
                        if (tipoPacote.toLowerCase() === 'bulky') {
                            tipoPacote = 'Bulky';
                        }

                        allData.push({
                            "Rota": routeName,
                            "Ordem": seq,
                            "Shipment": row['Shipment'] || '-',
                            "Estado": row['Estado'] || '-',
                            "Cidade": row['Cidade'] || '-',
                            "Bairro": row['Bairro'] || '-',
                            "CEP": row['CEP'] || '-',
                            "Tipo de veiculo": row['Veiculo'] || '-',
                            "SPR": row['SPR'] || '-',
                            "T. End.": tipo,
                            "T. Cli.": row['tipo_cliente'] || '-',
                            "Ação": row['tipo_de_acao'] || '-',
                            "Pacote": tipoPacote
                        });
                    });
                });

                // Cria uma nova folha (worksheet) e o ficheiro (workbook)
                const worksheet = XLSX.utils.json_to_sheet(allData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Todas as Rotas");
                
                // Faz o download do ficheiro
                XLSX.writeFile(workbook, "Planeamento_Rotas.xlsx");
            };

            return (
                <div className="min-h-screen p-6 flex flex-col items-center">
                    <div className="w-full max-w-5xl bg-white rounded-xl shadow-lg p-8">
                        
                        <div className="flex items-center space-x-3 mb-8 border-b pb-4">
                            <Icon name="map" className="w-8 h-8 text-blue-600" />
                            <h1 className="text-2xl font-bold text-gray-800">Criador de Rotas de Entrega</h1>
                        </div>

                        {/* Área de Upload */}
                        {!Object.keys(routes).length && (
                            <div 
                                className={`border-2 border-dashed rounded-xl p-10 text-center transition-colors cursor-pointer
                                    ${isDragging ? 'drag-active' : 'border-gray-300 hover:bg-gray-50'}`}
                                onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                                onDragLeave={() => setIsDragging(false)}
                                onDrop={(e) => {
                                    e.preventDefault();
                                    setIsDragging(false);
                                    handleFileUpload(e.dataTransfer.files[0]);
                                }}
                                onClick={() => !processing && fileInputRef.current.click()}
                            >
                                <input 
                                    type="file" 
                                    accept=".csv" 
                                    className="hidden" 
                                    ref={fileInputRef}
                                    onChange={(e) => handleFileUpload(e.target.files[0])}
                                />
                                {processing ? (
                                    <div className="flex flex-col items-center">
                                        <Icon name="loader-2" className="w-12 h-12 text-blue-600 animate-spin mb-4" />
                                        <h3 className="text-lg font-medium text-gray-700">A processar o ficheiro...</h3>
                                    </div>
                                ) : (
                                    <>
                                        <Icon name="file-spreadsheet" className="w-12 h-12 text-gray-400 mx-auto mb-4" />
                                        <h3 className="text-lg font-medium text-gray-700 mb-1">Arraste o seu ficheiro CSV aqui</h3>
                                        <p className="text-sm text-gray-500">ou clique para procurar no seu computador</p>
                                        
                                        <div className="mt-6 text-xs text-left text-gray-500 bg-gray-100 p-4 rounded-md">
                                            <p className="font-semibold mb-1">Colunas que serão impressas no PDF e na Planilha:</p>
                                            <p>Ordem, Shipment, Estado, Cidade, Bairro, CEP, Tipo de veiculo, SPR, tipo_de_endereco, tipo_cliente, tipo_de_acao, tipo_pacote</p>
                                        </div>
                                    </>
                                )}
                            </div>
                        )}

                        {/* Mensagem de Erro */}
                        {error && (
                            <div className="mt-4 p-4 bg-red-50 text-red-600 rounded-md flex items-center">
                                <Icon name="alert-circle" className="w-5 h-5 mr-2" />
                                {error}
                            </div>
                        )}

                        {/* Lista de Rotas Processadas */}
                        {Object.keys(routes).length > 0 && (
                            <div>
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                                    <div>
                                        <h2 className="text-xl font-semibold text-gray-800">Rotas Identificadas</h2>
                                        <p className="text-sm text-gray-500">
                                            {Object.keys(routes).length} rotas encontradas • {csvData.length} pacotes no total
                                        </p>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        <button 
                                            onClick={() => { setRoutes({}); setFile(null); setCsvData([]); }}
                                            className="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition"
                                            disabled={processing}
                                        >
                                            Novo Ficheiro
                                        </button>
                                        <button 
                                            onClick={exportToExcel}
                                            className="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition flex items-center inline-flex"
                                            disabled={processing}
                                        >
                                            <Icon name="table" className="w-4 h-4 mr-2" />
                                            Exportar Planilha
                                        </button>
                                        <button 
                                            onClick={downloadAllAsZip}
                                            className={`px-4 py-2 text-white rounded-lg transition flex items-center inline-flex ${processing ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}
                                            disabled={processing}
                                        >
                                            {processing ? (
                                                <><Icon name="loader-2" className="w-4 h-4 mr-2 animate-spin" /> A compactar ZIP...</>
                                            ) : (
                                                <><Icon name="archive" className="w-4 h-4 mr-2" /> Transferir Todos (ZIP)</>
                                            )}
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {Object.entries(routes).map(([routeName, routeData]) => (
                                        <div key={routeName} className="border border-gray-200 rounded-lg p-4 flex justify-between items-center hover:shadow-sm transition">
                                            <div className="flex items-center space-x-3">
                                                <div className="bg-blue-100 p-2 rounded-lg">
                                                    <Icon name="truck" className="w-5 h-5 text-blue-600" />
                                                </div>
                                                <div>
                                                    <h3 className="font-semibold text-gray-800 text-lg">{routeName}</h3>
                                                    <p className="text-sm text-gray-500">{routeData.length} pacotes</p>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => generatePDF(routeName, routeData)}
                                                className="p-2 text-blue-600 hover:bg-blue-50 rounded-md transition"
                                                title="Transferir PDF desta rota"
                                                disabled={processing}
                                            >
                                                <Icon name="file-down" className="w-5 h-5" />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
